version: "3.8"

# Portainer Docker Swarm stack for AgentSlicer.
# Replace the three CHANGE_ME values before deploying the stack.
services:
  agent-slicer:
    # GHCR must contain this tag and be public, or Portainer must have
    # authenticated read access to the private package.
    image: ghcr.io/3dstisk/agentslicer:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Prague

      # Browser desktop settings.
      PIXELFLUX_WAYLAND: "false"
      SELKIES_MANUAL_WIDTH: "1920"
      SELKIES_MANUAL_HEIGHT: "1080"
      MAX_RES: 1920x1080
      SELKIES_SCALING_DPI: "96"
      TITLE: AgentSlicer
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      DISABLE_ZINK: "true"
      HARDEN_DESKTOP: "true"
      START_DOCKER: "false"
      SELKIES_FILE_TRANSFERS: none
      SELKIES_COMMAND_ENABLED: "false"
      SELKIES_ENABLE_SHARING: "false"

      # Protect the browser desktop exposed through Traefik.
      CUSTOM_USER: 'CHANGE_ME_AGENT_SLICER_USER'
      PASSWORD: 'CHANGE_ME_AGENT_SLICER_PASSWORD'

      # MCP server. Use a long random token without Compose interpolation syntax.
      AGENT_SLICER_MCP_HOST: 0.0.0.0
      AGENT_SLICER_MCP_PORT: "8765"
      AGENT_SLICER_TOKEN: 'CHANGE_ME_LONG_RANDOM_TOKEN'
      AGENT_SLICER_ALLOWED_HOSTS: agent-slicer.3dstisk.com
      AGENT_SLICER_ALLOWED_ORIGINS: agent-slicer.3dstisk.com
      AGENT_SLICER_BRIDGE_SOCKET: /run/agent-slicer/orca-agent.sock
      AGENT_SLICER_MAX_IMPORT_BYTES: "536870912"
      AGENT_SLICER_MAX_UPLOAD_BYTES: "536870912"
      AGENT_SLICER_UPLOAD_TTL_MS: "900000"
      AGENT_SLICER_SCREENSHOT_ROOTS: /screenshots/mcp
      AGENT_SLICER_DESKTOP_SCREENSHOT_ROOT: /screenshots
      AGENT_SLICER_CAPTURE_EXECUTABLE: /usr/local/bin/capture-orca

    volumes:
      - agent-slicer-config:/config
      - agent-slicer-workspace:/workspace
      - agent-slicer-screenshots:/screenshots
      - agent-slicer-outputs:/outputs
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 1073741824

    networks:
      - nginx-proxy-public

    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "5"
        - http://127.0.0.1:8765/readyz
      interval: 10s
      timeout: 7s
      retries: 12
      start_period: 120s

    stop_grace_period: 60s

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.platform.arch == x86_64
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 180s
      update_config:
        parallelism: 1
        order: stop-first
        monitor: 180s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 180s
      labels:
        - "traefik.enable=true"

        # Browser desktop: https://agent-slicer.3dstisk.com/
        - "traefik.http.routers.3dstisk_agent_slicer.rule=Host(`agent-slicer.3dstisk.com`)"
        - "traefik.http.routers.3dstisk_agent_slicer.entrypoints=websecure"
        - "traefik.http.routers.3dstisk_agent_slicer.tls=true"
        - "traefik.http.routers.3dstisk_agent_slicer.priority=10"
        - "traefik.http.routers.3dstisk_agent_slicer.service=3dstisk_agent_slicer"
        - "traefik.http.services.3dstisk_agent_slicer.loadbalancer.server.port=3000"

        # MCP API and authenticated model uploads.
        - "traefik.http.routers.3dstisk_agent_slicer_mcp.rule=Host(`agent-slicer.3dstisk.com`) && (PathPrefix(`/mcp`) || PathPrefix(`/uploads`))"
        - "traefik.http.routers.3dstisk_agent_slicer_mcp.entrypoints=websecure"
        - "traefik.http.routers.3dstisk_agent_slicer_mcp.tls=true"
        - "traefik.http.routers.3dstisk_agent_slicer_mcp.priority=100"
        - "traefik.http.routers.3dstisk_agent_slicer_mcp.service=3dstisk_agent_slicer_mcp"
        - "traefik.http.services.3dstisk_agent_slicer_mcp.loadbalancer.server.port=8765"

        - "traefik.swarm.network=nginx-proxy-public"

volumes:
  agent-slicer-config:
    driver: local
  agent-slicer-workspace:
    driver: local
  agent-slicer-screenshots:
    driver: local
  agent-slicer-outputs:
    driver: local

networks:
  nginx-proxy-public:
    external: true
