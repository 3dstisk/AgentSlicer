x-agent-slicer-worker-token: &agent-slicer-worker-token 'CHANGE_ME_LONG_RANDOM_WORKER_TOKEN'

x-agent-slicer-worker: &agent-slicer-worker
  image: ghcr.io/3dstisk/agentslicer:latest
  environment:
    PUID: "1000"
    PGID: "1000"
    TZ: Europe/Prague
    AGENT_SLICER_MCP_HOST: 0.0.0.0
    AGENT_SLICER_MCP_PORT: "8765"
    AGENT_SLICER_TOKEN: *agent-slicer-worker-token
    AGENT_SLICER_ALLOWED_HOSTS: localhost,127.0.0.1,[::1]
    AGENT_SLICER_ALLOWED_ORIGINS: localhost,127.0.0.1,[::1]
    HARDEN_DESKTOP: "true"
    START_DOCKER: "false"
    SELKIES_FILE_TRANSFERS: none
    SELKIES_COMMAND_ENABLED: "false"
    SELKIES_ENABLE_SHARING: "false"
    AGENT_SLICER_MAX_IMPORT_BYTES: "536870912"
    AGENT_SLICER_MAX_UPLOAD_BYTES: "536870912"
    AGENT_SLICER_UPLOAD_TTL_MS: "900000"
    AGENT_SLICER_SCREENSHOT_ROOTS: /screenshots/mcp
    AGENT_SLICER_DESKTOP_SCREENSHOT_ROOT: /screenshots
    AGENT_SLICER_CAPTURE_EXECUTABLE: /usr/local/bin/capture-orca
  networks:
    - agent-slicer-pool
  volumes:
    - type: tmpfs
      target: /dev/shm
      tmpfs:
        size: 1073741824
  healthcheck:
    test:
      - CMD
      - curl
      - --fail
      - --silent
      - --show-error
      - --max-time
      - "5"
      - http://127.0.0.1:8765/readyz
    interval: 10s
    timeout: 7s
    retries: 12
    start_period: 120s
  stop_grace_period: 60s
  deploy:
    mode: replicated
    replicas: 1
    placement:
      constraints:
        - node.platform.arch == x86_64
    restart_policy:
      condition: any
      delay: 10s
    update_config:
      parallelism: 1
      order: stop-first
      monitor: 180s
      failure_action: rollback
    rollback_config:
      parallelism: 1
      order: stop-first
      monitor: 180s

# Portainer Docker Swarm stack for the AgentSlicer fixed worker pool.
#
# Before deployment:
# 1. Replace both CHANGE_ME token values.
# 2. The pool token must contain at least 48 random characters.
# 3. Configure the same pool token as AGENT_SLICER_POOL_TOKEN in Email Assistant and AI Ops.
# 4. Configure AGENT_SLICER_POOL_URL=https://agent-slicer.3dstisk.com in both apps.
services:
  agent-slicer-pool:
    # The pool image manages leases across the three fixed worker services.
    image: ghcr.io/3dstisk/agentslicer-pool:latest
    environment:
      TZ: Europe/Prague
      AGENT_SLICER_POOL_HOST: 0.0.0.0
      AGENT_SLICER_POOL_PORT: "8765"
      AGENT_SLICER_POOL_TOKEN: 'CHANGE_ME_LONG_RANDOM_POOL_TOKEN'
      AGENT_SLICER_POOL_ID: production
      AGENT_SLICER_POOL_ALLOWED_HOSTS: agent-slicer.3dstisk.com
      AGENT_SLICER_POOL_ALLOWED_ORIGINS: agent-slicer.3dstisk.com

      # Three fixed workers can serve three agents concurrently. Additional lease
      # requests wait in the bounded FIFO queue.
      AGENT_SLICER_POOL_MAX_QUEUE: "100"
      AGENT_SLICER_POOL_ACQUIRE_WAIT_MS: "60000"
      AGENT_SLICER_POOL_LEASE_TTL_MS: "1800000"
      AGENT_SLICER_POOL_RETRY_DELAY_MS: "5000"

      AGENT_SLICER_POOL_WORKERS: http://agent-slicer-worker-1:8765,http://agent-slicer-worker-2:8765,http://agent-slicer-worker-3:8765
      AGENT_SLICER_POOL_WORKER_TOKEN: *agent-slicer-worker-token

    networks:
      - agent-slicer-pool
      - nginx-proxy-public

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8765/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 7s
      retries: 12
      start_period: 180s

    stop_grace_period: 90s

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.platform.arch == x86_64
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 180s
      update_config:
        parallelism: 1
        order: stop-first
        monitor: 180s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 180s
      labels:
        - "traefik.enable=true"

        # Lease management, MCP, uploads, outputs, and health all reach the
        # pool gateway. Authentication is enforced by the gateway itself.
        - "traefik.http.routers.3dstisk_agent_slicer_pool.rule=Host(`agent-slicer.3dstisk.com`) && (Path(`/leases`) || PathPrefix(`/leases/`) || Path(`/mcp`) || PathPrefix(`/mcp/`) || PathPrefix(`/uploads/`) || Path(`/outputs`) || PathPrefix(`/outputs/`) || Path(`/livez`) || Path(`/readyz`) || Path(`/healthz`))"
        - "traefik.http.routers.3dstisk_agent_slicer_pool.entrypoints=websecure"
        - "traefik.http.routers.3dstisk_agent_slicer_pool.tls=true"
        - "traefik.http.routers.3dstisk_agent_slicer_pool.priority=100"
        - "traefik.http.routers.3dstisk_agent_slicer_pool.service=3dstisk_agent_slicer_pool"
        - "traefik.http.services.3dstisk_agent_slicer_pool.loadbalancer.server.port=8765"
        - "traefik.swarm.network=nginx-proxy-public"

  agent-slicer-worker-1:
    <<: *agent-slicer-worker

  agent-slicer-worker-2:
    <<: *agent-slicer-worker

  agent-slicer-worker-3:
    <<: *agent-slicer-worker

networks:
  # The gateway and its three fixed workers share this fixed-name,
  # attachable overlay network. It is not connected to Traefik.
  agent-slicer-pool:
    name: agent-slicer-pool
    driver: overlay
    attachable: true

  nginx-proxy-public:
    external: true
