x-agent-slicer-worker: &agent-slicer-worker
  image: "${AGENT_SLICER_IMAGE:-ghcr.io/3dstisk/agentslicer:latest}"
  platform: linux/amd64
  environment:
    PUID: "${PUID:-1000}"
    PGID: "${PGID:-1000}"
    TZ: "${TZ:-Europe/Prague}"
    AGENT_SLICER_MCP_HOST: "0.0.0.0"
    AGENT_SLICER_MCP_PORT: "8765"
    AGENT_SLICER_TOKEN: "${AGENT_SLICER_POOL_WORKER_TOKEN:?AGENT_SLICER_POOL_WORKER_TOKEN must be set}"
    AGENT_SLICER_ALLOWED_HOSTS: "localhost,127.0.0.1,[::1]"
    AGENT_SLICER_ALLOWED_ORIGINS: "localhost,127.0.0.1,[::1]"
    HARDEN_DESKTOP: "true"
    START_DOCKER: "false"
    SELKIES_FILE_TRANSFERS: "none"
    SELKIES_COMMAND_ENABLED: "false"
    SELKIES_ENABLE_SHARING: "false"
    AGENT_SLICER_MAX_IMPORT_BYTES: "${AGENT_SLICER_MAX_IMPORT_BYTES:-536870912}"
    AGENT_SLICER_MAX_UPLOAD_BYTES: "${AGENT_SLICER_MAX_UPLOAD_BYTES:-536870912}"
    AGENT_SLICER_UPLOAD_TTL_MS: "${AGENT_SLICER_UPLOAD_TTL_MS:-900000}"
    AGENT_SLICER_SCREENSHOT_ROOTS: "/screenshots/mcp"
    AGENT_SLICER_DESKTOP_SCREENSHOT_ROOT: "/screenshots"
    AGENT_SLICER_CAPTURE_EXECUTABLE: "/usr/local/bin/capture-orca"
  networks:
    - agent-slicer-pool
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:8765/readyz"]
    interval: 10s
    timeout: 7s
    start_period: 120s
    retries: 12
  security_opt:
    - no-new-privileges:true
  shm_size: "1gb"
  restart: unless-stopped

services:
  agent-slicer-worker-1:
    <<: *agent-slicer-worker

  agent-slicer-worker-2:
    <<: *agent-slicer-worker

  agent-slicer-worker-3:
    <<: *agent-slicer-worker

  agent-pool:
    build:
      context: .
      dockerfile: docker/agent-pool/Dockerfile
    image: "${AGENT_SLICER_POOL_IMAGE:-agent-slicer-pool:dev}"
    environment:
      TZ: "${TZ:-Europe/Prague}"
      AGENT_SLICER_POOL_HOST: "0.0.0.0"
      AGENT_SLICER_POOL_PORT: "8765"
      AGENT_SLICER_POOL_TOKEN: "${AGENT_SLICER_POOL_TOKEN:?AGENT_SLICER_POOL_TOKEN must be set}"
      AGENT_SLICER_POOL_ID: "${AGENT_SLICER_POOL_ID:-default}"
      AGENT_SLICER_POOL_ALLOWED_HOSTS: "${AGENT_SLICER_POOL_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}"
      AGENT_SLICER_POOL_ALLOWED_ORIGINS: "${AGENT_SLICER_POOL_ALLOWED_ORIGINS:-localhost,127.0.0.1,[::1]}"
      AGENT_SLICER_POOL_MAX_QUEUE: "${AGENT_SLICER_POOL_MAX_QUEUE:-100}"
      AGENT_SLICER_POOL_ACQUIRE_WAIT_MS: "${AGENT_SLICER_POOL_ACQUIRE_WAIT_MS:-60000}"
      AGENT_SLICER_POOL_LEASE_TTL_MS: "${AGENT_SLICER_POOL_LEASE_TTL_MS:-1800000}"
      AGENT_SLICER_POOL_WORKERS: "http://agent-slicer-worker-1:8765,http://agent-slicer-worker-2:8765,http://agent-slicer-worker-3:8765"
      AGENT_SLICER_POOL_WORKER_TOKEN: "${AGENT_SLICER_POOL_WORKER_TOKEN:?AGENT_SLICER_POOL_WORKER_TOKEN must be set}"
    ports:
      - "127.0.0.1:${AGENT_SLICER_POOL_PORT:-8765}:8765"
    networks:
      - agent-slicer-pool
    depends_on:
      agent-slicer-worker-1:
        condition: service_healthy
      agent-slicer-worker-2:
        condition: service_healthy
      agent-slicer-worker-3:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8765/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 7s
      start_period: 180s
      retries: 12
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  agent-slicer-pool:
    name: agent-slicer-pool
