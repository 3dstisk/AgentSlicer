name: AgentSlicer x86_64 images

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Bump this epoch when the native runner/toolchain or updater-signing input
  # changes without a corresponding tracked-file change.
  NATIVE_IMAGE_CACHE_VERSION: v2

jobs:
  native-image:
    name: Resolve native OrcaSlicer image
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: read
    outputs:
      candidate-image: ${{ steps.identity.outputs.candidate-image }}
      exists: ${{ steps.lookup.outputs.exists }}
      image: ${{ steps.identity.outputs.image }}
      key: ${{ steps.identity.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: "false"

      - name: Compute native image identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          native_key=$(scripts/native-image-key HEAD)
          image="ghcr.io/$owner/agentslicer-native:linux-amd64-${NATIVE_IMAGE_CACHE_VERSION}-${native_key}"
          candidate_image="ghcr.io/$owner/agentslicer-native:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "key=$native_key" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "candidate-image=$candidate_image" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check native image
        id: lookup
        env:
          NATIVE_IMAGE: ${{ steps.identity.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          if inspect_output=$(docker manifest inspect "$NATIVE_IMAGE" 2>&1); then
            echo "Reusing $NATIVE_IMAGE"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'manifest unknown|no such manifest' <<< "$inspect_output"; then
            echo "No native image found for this source tree"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$inspect_output" >&2
            exit 1
          fi

  build-linux-x86_64:
    name: Build OrcaSlicer Linux x86_64
    needs: native-image
    if: needs.native-image.outputs.exists != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: blacksmith-8vcpu-ubuntu-2404
      ghcr-cache: true
    secrets: inherit

  test-linux-x86_64:
    name: Test OrcaSlicer Linux x86_64
    needs: [native-image, build-linux-x86_64]
    if: needs.native-image.outputs.exists != 'true' && needs.build-linux-x86_64.result == 'success'
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: blacksmith-8vcpu-ubuntu-2404
      artifact: ${{ github.sha }}-tests-linux-x86_64

  publish-native-image:
    name: Publish native OrcaSlicer candidate
    needs: [native-image, build-linux-x86_64, test-linux-x86_64]
    if: ${{ always() && !cancelled() && needs.native-image.outputs.exists != 'true' && needs.build-linux-x86_64.result == 'success' && needs.test-linux-x86_64.result == 'success' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    outputs:
      candidate-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: "false"

      - name: Download x86_64 AppImage
        uses: actions/download-artifact@v8
        with:
          pattern: OrcaSlicer_Linux_ubuntu_2404_*
          path: release
          merge-multiple: true

      - name: Prepare native image context
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$appimage"
          chmod 0755 "$appimage"
          mkdir -p docker/agent-native/dist
          cp "$appimage" docker/agent-native/dist/OrcaSlicer.AppImage

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Another tag with the same native key may have published while this run
      # was compiling. Avoid publishing a redundant candidate when that happens.
      - name: Recheck native image
        id: recheck
        env:
          NATIVE_IMAGE: ${{ needs.native-image.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          if inspect_output=$(docker manifest inspect "$NATIVE_IMAGE" 2>&1); then
            echo "Reusing $NATIVE_IMAGE published by another run"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'manifest unknown|no such manifest' <<< "$inspect_output"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$inspect_output" >&2
            exit 1
          fi

      - name: Build and publish native candidate
        id: build
        if: steps.recheck.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/agent-native/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ needs.native-image.outputs.candidate-image }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.native-image.outputs.key }}
          cache-from: type=gha,scope=agent-slicer-native
          cache-to: type=gha,mode=max,scope=agent-slicer-native

  resolve-native-image:
    name: Pin native OrcaSlicer image digest
    needs: [native-image, publish-native-image]
    if: ${{ always() && !cancelled() && (needs.native-image.outputs.exists == 'true' || needs.publish-native-image.result == 'success') }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      promote: ${{ steps.resolve.outputs.promote }}
      source-image: ${{ steps.resolve.outputs.source-image }}
      target-image: ${{ steps.resolve.outputs.target-image }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable digest
        id: resolve
        env:
          CANDIDATE_DIGEST: ${{ needs.publish-native-image.outputs.candidate-digest }}
          CANDIDATE_IMAGE: ${{ needs.native-image.outputs.candidate-image }}
          NATIVE_IMAGE: ${{ needs.native-image.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          if inspect_output=$(docker manifest inspect "$NATIVE_IMAGE" 2>&1); then
            source_image=$NATIVE_IMAGE
            promote=false
          elif grep -Eqi 'manifest unknown|no such manifest' <<< "$inspect_output"; then
            [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            repository=${CANDIDATE_IMAGE%:*}
            source_image=$repository@$CANDIDATE_DIGEST
            promote=true
          else
            echo "$inspect_output" >&2
            exit 1
          fi
          digest=$(docker buildx imagetools inspect "$source_image" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          repository=${NATIVE_IMAGE%:*}
          echo "image=$repository@$digest" >> "$GITHUB_OUTPUT"
          echo "promote=$promote" >> "$GITHUB_OUTPUT"
          echo "source-image=$source_image" >> "$GITHUB_OUTPUT"
          echo "target-image=$NATIVE_IMAGE" >> "$GITHUB_OUTPUT"

  publish:
    name: Test and publish worker plus pool images
    needs: resolve-native-image
    if: ${{ always() && !cancelled() && needs.resolve-native-image.result == 'success' }}
    runs-on: blacksmith-8vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: "false"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Node.js for Docker E2E
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/agent-mcp/package-lock.json

      - name: Install Docker E2E client
        run: npm ci --prefix src/agent-mcp

      - name: Verify MCP adapter
        run: |
          npm run typecheck --prefix src/agent-mcp
          npm test --prefix src/agent-mcp

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentslicer
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=sha,format=long,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Generate pool container metadata
        id: pool_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentslicer-pool
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=sha,format=long,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build exact x86_64 container for E2E
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/agent-slicer/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ORCASLICER_NATIVE_IMAGE=${{ needs.resolve-native-image.outputs.image }}
            BUILD_VERSION=${{ github.ref_name }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run authenticated Docker E2E
        id: docker-e2e
        env:
          AGENT_SLICER_IMAGE: ghcr.io/${{ github.repository_owner }}/agentslicer:${{ steps.meta.outputs.version }}
          AGENT_SLICER_TOKEN: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          AGENT_SLICER_START_TIMEOUT_SECONDS: "600"
          AGENT_SLICER_MAX_IMPORT_BYTES: "1048576"
        shell: bash
        run: |
          set -euo pipefail
          PUID="$(id -u)"
          PGID="$(id -g)"
          export PUID PGID
          mkdir -p runtime/workspace runtime/e2e-artifacts runtime/outputs
          cleanup() {
            status=$?
            docker logs agent-slicer-orca > runtime/e2e-artifacts/container.log 2>&1 || true
            ./scripts/agent-slicer-down || true
            exit "$status"
          }
          trap cleanup EXIT
          ./scripts/agent-slicer-up
          node src/agent-mcp/e2e/docker-e2e.mjs

      - name: Upload Docker E2E failure artifacts
        if: failure() && steps.docker-e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: agent-slicer-docker-e2e-${{ github.run_id }}
          path: |
            runtime/e2e-artifacts/
            runtime/config/.config/OrcaSlicer/log/
            runtime/outputs/
            runtime/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Promote tested native image
        if: needs.resolve-native-image.outputs.promote == 'true'
        env:
          NATIVE_IMAGE: ${{ needs.resolve-native-image.outputs.target-image }}
          SOURCE_IMAGE: ${{ needs.resolve-native-image.outputs.source-image }}
        shell: bash
        run: |
          set -euo pipefail
          if inspect_output=$(docker manifest inspect "$NATIVE_IMAGE" 2>&1); then
            echo "Another successful run already promoted $NATIVE_IMAGE"
          elif grep -Eqi 'manifest unknown|no such manifest' <<< "$inspect_output"; then
            docker buildx imagetools create --tag "$NATIVE_IMAGE" "$SOURCE_IMAGE"
          else
            echo "$inspect_output" >&2
            exit 1
          fi

      - name: Push tested container tags
        if: github.event_name == 'push'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            test -n "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

      - name: Build and push AgentSlicer pool gateway
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/agent-pool/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.pool_meta.outputs.tags }}
          labels: ${{ steps.pool_meta.outputs.labels }}
          cache-from: type=gha,scope=agent-slicer-pool
          cache-to: type=gha,mode=max,scope=agent-slicer-pool

      - name: Verify published latest tags
        if: github.event_name == 'push'
        env:
          POOL_LATEST_IMAGE: ghcr.io/${{ github.repository_owner }}/agentslicer-pool:latest
          POOL_VERSION_IMAGE: ghcr.io/${{ github.repository_owner }}/agentslicer-pool:${{ steps.pool_meta.outputs.version }}
          WORKER_LATEST_IMAGE: ghcr.io/${{ github.repository_owner }}/agentslicer:latest
          WORKER_VERSION_IMAGE: ghcr.io/${{ github.repository_owner }}/agentslicer:${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          verify_latest() {
            local version_image=$1
            local latest_image=$2
            local version_digest latest_digest
            version_digest=$(docker buildx imagetools inspect "$version_image" --format '{{json .Manifest.Digest}}' | tr -d '"')
            latest_digest=$(docker buildx imagetools inspect "$latest_image" --format '{{json .Manifest.Digest}}' | tr -d '"')
            [[ "$version_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            test "$latest_digest" = "$version_digest"
          }
          verify_latest "$WORKER_VERSION_IMAGE" "$WORKER_LATEST_IMAGE"
          verify_latest "$POOL_VERSION_IMAGE" "$POOL_LATEST_IMAGE"
