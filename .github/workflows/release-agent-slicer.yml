name: AgentSlicer x86_64 image

on:
  push:
    branches:
      - main
    tags:
      - "*"
    paths:
      - ".github/actions/**"
      - ".github/workflows/build_check_cache.yml"
      - ".github/workflows/build_deps.yml"
      - ".github/workflows/build_orca.yml"
      - ".github/workflows/release-agent-slicer.yml"
      - ".github/workflows/unit_tests.yml"
      - "CMakeLists.txt"
      - "**/CMakeLists.txt"
      - "build_linux.sh"
      - "compose*.yaml"
      - "deps/**"
      - "deps_src/**"
      - "docker/**"
      - "localization/**"
      - "resources/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "version.inc"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-x86_64:
    name: Build OrcaSlicer Linux x86_64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ubuntu-24.04

  test-linux-x86_64:
    name: Test OrcaSlicer Linux x86_64
    needs: build-linux-x86_64
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: ubuntu-24.04
      artifact: ${{ github.sha }}-tests-linux-x86_64

  publish:
    name: Test image and publish push builds
    needs: [build-linux-x86_64, test-linux-x86_64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: "false"

      - name: Download x86_64 AppImage
        uses: actions/download-artifact@v8
        with:
          pattern: OrcaSlicer_Linux_ubuntu_2404_*
          path: release
          merge-multiple: true

      - name: Prepare Docker context
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$appimage"
          chmod 0755 "$appimage"
          mkdir -p docker/agent-slicer/dist
          cp "$appimage" docker/agent-slicer/dist/OrcaSlicer.AppImage

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Node.js for Docker E2E
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/agent-mcp/package-lock.json

      - name: Install Docker E2E client
        run: npm ci --prefix src/agent-mcp

      - name: Verify MCP adapter
        run: |
          npm run typecheck --prefix src/agent-mcp
          npm test --prefix src/agent-mcp

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentslicer
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=sha,format=long,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build exact x86_64 container for E2E
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/agent-slicer/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run authenticated Docker E2E
        id: docker-e2e
        env:
          AGENT_SLICER_IMAGE: ghcr.io/${{ github.repository_owner }}/agentslicer:${{ steps.meta.outputs.version }}
          AGENT_SLICER_TOKEN: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          AGENT_SLICER_START_TIMEOUT_SECONDS: "600"
          AGENT_SLICER_MAX_IMPORT_BYTES: "1048576"
        shell: bash
        run: |
          set -euo pipefail
          PUID="$(id -u)"
          PGID="$(id -g)"
          export PUID PGID
          mkdir -p runtime/workspace runtime/e2e-artifacts runtime/outputs
          cp tests/data/20mm_cube.obj runtime/workspace/20mm_cube.obj
          cleanup() {
            status=$?
            docker compose -f compose.yaml logs --no-color > runtime/e2e-artifacts/docker-compose.log 2>&1 || true
            ./scripts/agent-slicer-down || true
            exit "$status"
          }
          trap cleanup EXIT
          ./scripts/agent-slicer-up
          node src/agent-mcp/e2e/docker-e2e.mjs

      - name: Upload Docker E2E failure artifacts
        if: failure() && steps.docker-e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: agent-slicer-docker-e2e-${{ github.run_id }}
          path: |
            runtime/e2e-artifacts/
            runtime/config/.config/OrcaSlicer/log/
            runtime/outputs/
            runtime/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Push tested container tags
        if: github.event_name == 'push'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            test -n "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
