name: Release AgentSlicer x86_64

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  packages: write

jobs:
  build-linux-x86_64:
    name: Build OrcaSlicer Linux x86_64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ubuntu-24.04
    secrets: inherit

  publish:
    name: Publish AppImage and container
    needs: build-linux-x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: "false"

      - name: Download x86_64 AppImage
        uses: actions/download-artifact@v8
        with:
          pattern: OrcaSlicer_Linux_ubuntu_2404_*
          path: release
          merge-multiple: true

      - name: Prepare release files and Docker context
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find release -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$appimage"
          chmod 0755 "$appimage"
          mkdir -p docker/agent-slicer/dist
          cp "$appimage" docker/agent-slicer/dist/OrcaSlicer.AppImage
          (
            cd release
            sha256sum ./*.AppImage > SHA256SUMS
          )

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentslicer
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and publish x86_64 container
        uses: docker/build-push-action@v7
        with:
          context: docker/agent-slicer
          file: docker/agent-slicer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_VERSION=${{ github.ref_name }}
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/*.AppImage release/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" \
              release/*.AppImage \
              release/SHA256SUMS \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
