name: Check AgentSlicer container scripts

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/shellcheck.yml"
      - "docker/agent-slicer/capture-orca"
      - "docker/agent-slicer/init-agent-slicer"
      - "docker/agent-slicer/service-agent-slicer-mcp"
      - "scripts/agent-slicer-*"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/shellcheck.yml"
      - "docker/agent-slicer/capture-orca"
      - "docker/agent-slicer/init-agent-slicer"
      - "docker/agent-slicer/service-agent-slicer-mcp"
      - "scripts/agent-slicer-*"

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Cache shellcheck download
        id: cache-shellcheck-v0_11
        uses: actions/cache@v6
        with:
          path: ~/shellcheck
          key: ${{ runner.os }}-shellcheck-v0_11

      - name: Download shellcheck
        if: steps.cache-shellcheck-v0_11.outputs.cache-hit != 'true'
        shell: bash
        env:
          INPUT_VERSION: "v0.11.0"
        run: |
          curl -L#o ~/sc.tar.xz "https://github.com/koalaman/shellcheck/releases/download/${INPUT_VERSION}/shellcheck-${INPUT_VERSION}.linux.x86_64.tar.xz"
          tar -xvf ~/sc.tar.xz -C ~
          mv ~/shellcheck-"${INPUT_VERSION}"/shellcheck ~/shellcheck

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Shellcheck container scripts
        run: |
          ~/shellcheck --shell=bash \
            docker/agent-slicer/capture-orca \
            docker/agent-slicer/init-agent-slicer \
            docker/agent-slicer/service-agent-slicer-mcp \
            scripts/agent-slicer-capture \
            scripts/agent-slicer-down \
            scripts/agent-slicer-up
