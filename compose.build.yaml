services:
  orcaslicer:
    build:
      context: .
      dockerfile: docker/agent-slicer/Dockerfile
      args:
        ORCASLICER_NATIVE_IMAGE: "${ORCASLICER_NATIVE_IMAGE:-agent-slicer-native:dev}"
        BUILD_VERSION: "${BUILD_VERSION:-dev}"
        BUILD_REVISION: "${BUILD_REVISION:-local}"
    image: "${AGENT_SLICER_IMAGE:-agent-slicer:dev}"
